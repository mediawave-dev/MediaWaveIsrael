    <!-- Primary Meta Tags — title/description/canonical/OG are owned per-route by
         SEO.tsx (react-helmet-async) and baked in at prerender. Keeping static
         copies here made every inner page serve the HOMEPAGE description, og:title,
         og:url and canonical FIRST — crawlers and link previews read the first
         occurrence, so search snippets and WhatsApp previews were wrong sitewide. -->
    <title>פיתוח אתרים ודפי נחיתה מותאמים לעסקים | MediaWave Israel</title>

    <!-- Theme & Mobile — constant dark brand navy on the browser chrome (no
         per-section change). Owner decision: address bar stays dark always. -->

    <meta name="msapplication-TileColor" content="#00113D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MediaWave" />

    <!-- Favicons: the Horizon mark (logos/horizon). ?v=5 busts the browser's sticky favicon
         cache after the Horizon redesign; bump it whenever the icon art changes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- RSS Feed -->

    <!-- Fonts: the display face (EFT Betaamango, /fonts) is preloaded by scripts/prerender.mjs.
         The H1 is the LCP element. No logo preload: the header
         draws the Horizon logo as inline SVG. -->

    <!-- The logo ident (DECISIONS #53) and the hero's opening (#64) play once per visit. Decided
         here, before first paint, so nothing shows and then replays: motion allowed (or
         ?motion=full), not a prerender, not ?reduce=1, not seen this visit. AnimatedLogo and
         Lens remove their classes; the timeouts are the safety net if the app never boots. -->
    <script>
      (function () { try {
        if (window.__PRERENDER__) return;
        var full = /[?&]motion=full(&|$)/.test(location.search);
        if (!full && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (/[?&]reduce=1(&|$)/.test(location.search)) return;
        var d = document.documentElement;
        if (location.pathname === '/' && !sessionStorage.getItem('mw-hero-iris')) {
          d.classList.add('hero-iris');
          setTimeout(function () { d.classList.remove('hero-iris'); }, 10000);
        }
        if (sessionStorage.getItem('mw-logo-ident')) return;
        d.classList.add('logo-intro');
        setTimeout(function () { d.classList.remove('logo-intro'); }, 4000);
      } catch (e) {} })();
    </script>

  <body>
    <!-- Page loading indicator: the Horizon mark (DECISIONS #52). The build's look plugin
         paints the ground and the two tones (vite.config.ts); no gradient, no shadow. -->
    <div id="page-loader" style="position:fixed;inset:0;background:#00113D;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease;pointer-events:auto;">
      <svg id="loader-mark" width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="MediaWave נטען">
        <path data-logo="a" fill="#FFFFFF" d="M0.19 45.63A37.51 37.51 0 0 0 47.87 47.23A44.51 44.51 0 0 1 99.8 45.55A50 50 0 0 0 0.19 45.63Z"/>
        <path data-logo="b" fill="#6E8CFF" d="M0.2 54.45A44.51 44.51 0 0 0 52.13 52.77A37.51 37.51 0 0 1 99.81 54.37A50 50 0 0 1 0.2 54.45Z"/>
      </svg>
      <style>
        @media (prefers-reduced-motion: no-preference) {
          #loader-mark { animation: lw-breathe 2.2s ease-in-out infinite; }
          @keyframes lw-breathe { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
        }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove loader once app mounts - fast removal to reduce CLS -->
    <script>
      // Remove loader as early as possible
      function removeLoader() {
        var loader = document.getElementById('page-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() { loader.remove(); }, 400);
        }
      }
      // Try to remove on DOMContentLoaded (earlier than load)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeLoader);
      } else {
        removeLoader();
      }
    </script>

    <!-- Noscript fallback -->
    <noscript>
      <style>
        #page-loader{display:none!important}
        /* The prerendered HTML carries every reveal's initial state inline
           (opacity: 0; transform...). Without JS nothing would ever reveal it,
           so show the sections as-is. Collapsed FAQ answers keep their height
           (they stay aria-hidden), and the lottie placeholders that would
           pulse forever are hidden. Chat, forms and the widgets need scripts. */
        [style*="opacity: 0;"]{opacity:1!important;transform:none!important}
        .animate-pulse{display:none!important}
      </style>
      <div style="text-align:center;padding:10px 16px;font-family:sans-serif;direction:rtl;background:#F1F5F9;color:#2A2A2A;font-size:14px;">

      </div>
    </noscript>
