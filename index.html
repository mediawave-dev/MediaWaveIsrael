    <!-- Page loading indicator - uses pointer-events:none to avoid CLS -->
    <div id="page-loader" style="position:fixed;inset:0;background:#F8FAFC;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease;pointer-events:auto;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style="animation:spin 1s linear infinite;">
        <circle cx="12" cy="12" r="10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- Static header for instant LCP - dimensions match React header exactly -->
    <header id="static-header" style="position:fixed;top:0;right:0;left:0;z-index:50;padding:0.75rem 0;background:transparent;" aria-hidden="true">

          decoding="async"

        />
      </div>
    </header>

    <!-- Remove loader once app mounts - fast removal to reduce CLS -->
    <script>
      // Remove loader as early as possible
      function removeLoader() {
        var loader = document.getElementById('page-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() { loader.remove(); }, 400);
        }
      }
      // Try to remove on DOMContentLoaded (earlier than load)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeLoader);
      } else {
        removeLoader();
      }
    </script>
