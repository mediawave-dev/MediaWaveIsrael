<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MediaWave">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Brand tile -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tile)"/>
  <!-- Three flowing wave crests from the MediaWave logo, thick->thin,
       spaced 5u so they stay distinct at 16px; round caps for a soft ribbon -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 13 Q 16 6 26 8"  stroke-width="2.6"/>
    <path d="M6 18 Q 16 11 26 13" stroke-width="2.3"/>
    <path d="M6 23 Q 16 16 26 18" stroke-width="2"/>
  </g>
</svg>
