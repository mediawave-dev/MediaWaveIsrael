  <polyline points="432,185 468,230 432,275" fill="none" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Left Bold Geometric 'M' -->
  <path d="M 88,305
