<title>לוח צבעים Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a header, then one card per palette; each card shows the logo on its dark and light
   ground, a site sample, and the swatches. Page chrome follows the viewer's theme; the palette
   panels are content and always show their own colours. */
:root {
  --bg: #F3F3F1; --fg: #141416; --muted: #5E5F66; --card: #FFFFFF; --line: #DCDCD8; --focus: #2D47E8;
  --display: 'Assistant', 'Arial Hebrew', Arial, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0D0D0F; --fg: #F2F2F3; --muted: #9A9BA3; --card: #17171A; --line: #2A2A2F; --focus: #8EA2FF; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0D0D0F; --fg: #F2F2F3; --muted: #9A9BA3; --card: #17171A; --line: #2A2A2F; --focus: #8EA2FF; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--display); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 20px; padding-block: 36px 64px; }
header { display: grid; gap: 8px; margin-bottom: 28px; }
h1 { margin: 0; font-weight: 800; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.1; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card--now { opacity: .85; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.num { font: 800 1.9rem/1 var(--display); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.name { font-weight: 800; font-size: 1.25rem; }
.en { color: var(--muted); font: 500 .8rem/1 var(--mono); direction: ltr; unicode-bidi: isolate; }
.why { margin: 0; color: var(--muted); font-size: .95rem; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.panel { border-radius: 10px; padding: 22px 16px 16px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel .lg { display: block; width: 100%; max-width: 250px; height: auto; direction: ltr; }
.panel .lg .a { fill: var(--a) } .panel .lg .b { fill: var(--b) } .panel .lg .t { fill: var(--t) } .panel .lg .l { fill: none; stroke: var(--t); stroke-width: 1.6; stroke-opacity: .55 }
.site { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.site b { font-weight: 800; font-size: 1.05rem; line-height: 1.15; color: var(--a2); }
.site b span { color: var(--b); }
.btn { border: 0; border-radius: 999px; padding: 8px 14px; font: 600 .9rem/1 var(--display); background: var(--acc); color: var(--accfg); white-space: nowrap; }
.chips { display: grid; gap: 6px; }
.sw { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sw > span { color: var(--muted); font-size: .8rem; min-width: 2.6em; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; background: transparent; color: var(--fg); font: 500 .75rem/1 var(--mono); cursor: pointer; direction: ltr; }
.chip i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip.ok { border-color: var(--focus); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 560px) { .panels { grid-template-columns: 1fr; } }
</style>
<div class="wrap" dir="rtl" lang="he">
  <header>
    <h1>לוח צבעים ללוגו Horizon</h1>
    <p>15 פלטות לבחירה, כל אחת עם הלוגו האמיתי על רקע כהה ועל רקע בהיר, ודוגמה קטנה לאיך זה ייראה באתר (כותרת וכפתור). הצורה של הלוגו לא משתנה, רק הצבעים. לחיצה על צבע מעתיקה את הקוד שלו. בחרו מספר.</p>

function panel(g, acc, label) {

function card(p, i) {
